name: Locked environment and complete synthetic pipeline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
      UV_PYTHON_DOWNLOADS: never
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.5'
          enable-cache: true
      - name: Install exact project and development dependencies
        run: uv sync --locked --all-groups
      - name: Check preserved V6/V7 and V8 supplement source
        run: |
          uv run --locked python scripts/check_notebook.py
          uv run --locked python scripts/check_notebook_v7.py
          uv run --locked python scripts/check_notebook_v8.py
      - name: Numerical and complete pipeline integration tests
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Execute every V7 notebook cell and all seven forms on synthetic data
        run: uv run --locked python scripts/run_notebook_v7.py --smoke --output outputs/v7-ci.executed.ipynb
      - name: Execute every V8 audit and pilot cell without retraining
        run: uv run --locked python scripts/run_notebook_v8.py --smoke --output outputs/v8-ci.executed.ipynb
