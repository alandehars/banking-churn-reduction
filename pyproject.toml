[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-churn-reduction"
version = "7.0.0"
description = "Reproducible banking churn analysis, validation and conditional retention simulation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy==2.5.4",
  "pandas==3.0.6",
  "scipy==1.18.1",
  "scikit-learn==1.9.1",
  "matplotlib==3.11.2",
  "seaborn==0.13.2",
  "joblib==1.6.0",
  "xgboost==3.4.1",
  "gdown==6.4.2",
  "packaging==26.3",
  "ipywidgets==8.1.9",
  "threadpoolctl==3.7.0",
  "nbformat==5.11.1",
  "nbclient==0.11.0",
  "ipykernel==7.4.0",
  "reportlab==5.1.0"
]

[project.scripts]
banking-churn = "banking_churn.cli:main"

[dependency-groups]
dev = ["setuptools==84.2.1", "wheel==0.48.0", "pypdf==6.21.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
required-version = "==0.13.5"
